[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mihenk"
dynamic = ["version"]
description = "A touchstone for discovered equations: check whether the law PySINDy found is real before you interpret it."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Aslan Satary Dizaji" }]
keywords = ["SINDy", "pysindy", "equation discovery", "system identification", "symbolic regression",
            "identifiability", "dynamical systems", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.23", "scipy>=1.9", "sympy>=1.11"]

[project.optional-dependencies]
pysindy = ["pysindy>=2.0"]
provenance = ["daftar>=1.0"]
test = ["pytest>=7", "pysindy>=2.0"]

[project.urls]
Homepage = "https://github.com/aslansd/mihenk"
Repository = "https://github.com/aslansd/mihenk"
Issues = "https://github.com/aslansd/mihenk/issues"
Changelog = "https://github.com/aslansd/mihenk/blob/main/CHANGELOG.md"

[project.scripts]
mihenk = "mihenk.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mihenk.__version__" }

[tool.setuptools.packages.find]
include = ["mihenk*"]
